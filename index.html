<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Links 2026</title>
    <style>
        /* Configurações Gerais - Modo Escuro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #00aaff;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 40px;
        }

        /* Estilização dos Links como Botões */
        .btn-link {
            text-decoration: none;
            color: #ffffff;
            background-color: #1e1e1e;
            padding: 15px 20px;
            border: 1px solid #333;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Efeito de Hover (passar o mouse) */
        .btn-link:hover {
            background-color: #00aaff;
            border-color: #00aaff;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 170, 255, 0.2);
        }

        .btn-link:active {
            transform: translateY(0);
        }

        /* Destaque para a segunda seção */
        .tools-section .btn-link {
            border-left: 5px solid #00aaff;
        }
    </style>
</head>
<body>

    <h2>Cursos Alura - Ricardo -  2026</h2>
    <section>
        <a href="https://cursos.alura.com.br/corp/7-ano-educacao-digital-e-computacao-programacao-e-robotica-professores-180237-p1040475" target="_blank" class="btn-link">7º Ano 2026</a>
        <a href="https://cursos.alura.com.br/corp/8-ano-educacao-digital-e-computacao-programacao-e-robotica-professores-180297-p1040503" target="_blank" class="btn-link">8º Ano 2026</a>
        <a href="https://cursos.alura.com.br/corp/9-ano-educacao-digital-e-computacao-programacao-e-robotica-professores-180300-p1040513" target="_blank" class="btn-link">9º Ano 2026</a>
    </section>

    <h2>Ferramentas e Tutoriais</h2>
    <section class="tools-section">
        <a href="https://classroom.google.com/" target="_blank" class="btn-link">Google Sala de Aula (Classroom)</a>
        <a href="https://cursos.alura.com.br/edutech" target="_blank" class="btn-link">ALURA</a>
        <a href="https://ricardobranco.vercel.app/scripts.html" target="_blank" class="btn-link">Tutorial Pós Instalação Linux</a>
    </section>

</body>
</html>
